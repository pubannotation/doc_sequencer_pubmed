# Basic Redis configuration for doc_sequencer_pubmed
# This file provides default Redis settings for development

# Network settings
bind 127.0.0.1
port 6379

# Memory settings
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistence settings (for failure cache durability)
save 900 1    # Save if at least 1 key changes in 900 seconds
save 300 10   # Save if at least 10 keys change in 300 seconds
save 60 10000 # Save if at least 10000 keys change in 60 seconds

# Enable AOF for better durability
appendonly yes
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""